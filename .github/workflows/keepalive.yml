name: Repository Keepalive

on:
  schedule:
    # 每 14 天运行一次（UTC），留足余量，避免仓库 60 天无活动被 GitHub 自动停用 Actions
    # UTC 16:00 = 北京时间次日 00:00
    - cron: '0 16 */14 * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Update keepalive timestamp
        run: |
          mkdir -p .github
          cat > .github/KEEPALIVE.md << EOF
          # Repository Keepalive

          This file is automatically updated to keep the repository active.

          **Last Update:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Workflow Run:** #${{ github.run_number }}
          **Trigger:** ${{ github.event_name }}

          ---
          *Auto-generated by [keepalive workflow](.github/workflows/keepalive.yml)*
          EOF

      - name: Commit and push changes
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # fork 仓库默认 GITHUB_TOKEN 只读，优先用 PAT 推送；未配置 PAT 时回退默认 token
          if [ -n "$PAT" ]; then
            git remote set-url origin "https://x-access-token:${PAT}@github.com/${{ github.repository }}.git"
          fi

          git add .github/KEEPALIVE.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: keepalive at $(date -u +'%Y-%m-%d')"
            git push
            echo "✅ Keepalive commit pushed successfully"
          fi
